name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & Build
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dev/*
          generate_release_notes: true
